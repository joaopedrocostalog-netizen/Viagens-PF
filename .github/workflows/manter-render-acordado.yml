name: Manter Render acordado

# O Render gratuito desliga o serviço após ~15 min sem acesso. Acordar leva cerca de 1 minuto
# e apaga as consultas preparadas na memória. Este acesso leve ao /api/health a cada 10 min evita isso.
# /api/health não consulta a DSS, não exige login e não grava nada.
# Observação: o GitHub pode atrasar execuções agendadas em horários de pico e desativa agendamentos
# após 60 dias sem commits no repositório (reative em Actions > "Manter Render acordado").

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: manter-render-acordado
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar /api/health
        env:
          HEALTH_URL: https://viagens-pf.onrender.com/api/health
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$HEALTH_URL" || echo 000)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::Render não respondeu 200 em 3 tentativas"
