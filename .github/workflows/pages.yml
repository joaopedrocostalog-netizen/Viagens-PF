name: Publicar portal (frontend)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validar sintaxe JavaScript
        run: node --check src/app.js && node --check src/dss-mapping.mjs && node --check src/operational.mjs && node --check src/reporting.mjs && node --check src/advanced-ui.mjs && node --check api/server.mjs && node --test tests/*.test.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos públicos
        run: |
          mkdir -p public_site
          cp index.html styles.css logo-costalog-sem-fundo-1024x876.png public_site/
          mkdir -p public_site/src
          cp src/app.js src/dss-mapping.mjs src/operational.mjs src/reporting.mjs src/advanced-ui.mjs public_site/src/
          touch public_site/.nojekyll
      - name: Enviar frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - name: Implantar
        id: deployment
        uses: actions/deploy-pages@v4
